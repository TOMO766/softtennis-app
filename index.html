<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ソフトテニス戦術AI</title>

<style>
body{
margin:0;
background:#0b1a33;
color:white;
text-align:center;
font-family:sans-serif;
}

canvas{
background:#2e8b57;
border:3px solid white;
touch-action:none;
margin-top:10px;
}

.slider{
width:80%;
}
</style>
</head>

<body>

<h2>ソフトテニス戦術AI</h2>
<p>赤＝相手後衛　黄＝前衛　青＝後衛</p>

<canvas id="court" width="360" height="520"></canvas>

<p>打球角度</p>
<input type="range" id="angle" min="10" max="60" value="25" class="slider">
<p id="angleText">25°</p>

<script>

const canvas=document.getElementById("court");
const ctx=canvas.getContext("2d");

let hitX=180;
let hitY=80;
let angle=25;

const netY = 260;

const slider=document.getElementById("angle");

slider.addEventListener("input",function(){
angle=parseInt(this.value);
document.getElementById("angleText").innerText=angle+"°";
draw();
});

function draw(){

ctx.clearRect(0,0,360,520);

// =====================
// コート（正確版）
// =====================

ctx.strokeStyle="white";
ctx.lineWidth=2;

// 外枠（ダブルス）
ctx.strokeRect(30,30,300,460);

// ネット
ctx.beginPath();
ctx.moveTo(30,netY);
ctx.lineTo(330,netY);
ctx.stroke();

// サービスライン
const serviceTop=160;
const serviceBottom=360;

ctx.beginPath();
ctx.moveTo(30,serviceTop);
ctx.lineTo(330,serviceTop);
ctx.moveTo(30,serviceBottom);
ctx.lineTo(330,serviceBottom);
ctx.stroke();

// センターライン（サービスボックス内のみ）
ctx.beginPath();
ctx.moveTo(180,serviceTop);
ctx.lineTo(180,netY);
ctx.moveTo(180,netY);
ctx.lineTo(180,serviceBottom);
ctx.stroke();

// シングルスライン
ctx.beginPath();
ctx.moveTo(90,30);
ctx.lineTo(90,490);
ctx.moveTo(270,30);
ctx.lineTo(270,490);
ctx.stroke();


// =====================
// 打球角度（扇形）
// =====================

let rad=angle*Math.PI/180;
let length=420;

let leftX=hitX-Math.tan(rad)*length;
let rightX=hitX+Math.tan(rad)*length;

ctx.fillStyle="rgba(255,150,0,0.3)";
ctx.beginPath();
ctx.moveTo(hitX,hitY);
ctx.lineTo(leftX,490);
ctx.lineTo(rightX,490);
ctx.closePath();
ctx.fill();


// =====================
// 前衛ロジック（修正版）
// =====================

// 基本：ネットより手前に固定
let frontY = netY + (hitY - netY) * 0.3;

// 🔥 絶対にネットを超えない
if(frontY < netY + 5) frontY = netY + 5;

// 後ろ制限
if(frontY > 340) frontY = 340;

// 横
let frontX = 180 + (hitX - 180) * 0.6;


// =====================
// 後衛
// =====================

let backX = 180 + (hitX - 180) * 0.5;
let backY = 460;


// =====================
// 描画
// =====================

// 前衛
ctx.fillStyle="yellow";
ctx.beginPath();
ctx.arc(frontX,frontY,10,0,Math.PI*2);
ctx.fill();

// 後衛
ctx.fillStyle="cyan";
ctx.beginPath();
ctx.arc(backX,backY,10,0,Math.PI*2);
ctx.fill();

// 打点
ctx.fillStyle="red";
ctx.beginPath();
ctx.arc(hitX,hitY,12,0,Math.PI*2);
ctx.fill();

}


// =====================
// 打点操作（改善版）
// =====================

canvas.addEventListener("touchmove",function(e){

let rect=canvas.getBoundingClientRect();

hitX=e.touches[0].clientX-rect.left;
hitY=e.touches[0].clientY-rect.top;

// 横制限
if(hitX<30)hitX=30;
if(hitX>330)hitX=330;

// 縦制限（相手コート＋ベースライン外OK）
if(hitY < 0) hitY = 0;
if(hitY > netY - 10) hitY = netY - 10;

draw();

});

draw();

</script>

</body>
</html>
