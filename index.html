<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ソフトテニス戦術AI</title>

<style>
body{
margin:0;
background:#0b1a33;
color:white;
text-align:center;
font-family:sans-serif;
}

canvas{
background:#2e8b57;
border:3px solid white;
touch-action:none;
margin-top:10px;
}
</style>
</head>

<body>

<h2>ソフトテニス戦術AI</h2>
<p>赤＝相手後衛　黄＝前衛　青＝後衛</p>

<canvas id="court" width="360" height="520"></canvas>

<script>

const canvas=document.getElementById("court");
const ctx=canvas.getContext("2d");

let hitX=300;
let hitY=80;

const netY=260;

function draw(){

ctx.clearRect(0,0,360,520);

// =====================
// コート（見た目改善）
// =====================

ctx.strokeStyle="white";
ctx.lineWidth=2;

// 外枠
ctx.strokeRect(30,30,300,460);

// ネット（太く）
ctx.lineWidth=4;
ctx.beginPath();
ctx.moveTo(30,netY);
ctx.lineTo(330,netY);
ctx.stroke();

ctx.lineWidth=2;

// サービスライン
const sTop=160;
const sBottom=360;

ctx.beginPath();
ctx.moveTo(30,sTop);
ctx.lineTo(330,sTop);
ctx.moveTo(30,sBottom);
ctx.lineTo(330,sBottom);
ctx.stroke();

// センターライン
ctx.beginPath();
ctx.moveTo(180,sTop);
ctx.lineTo(180,sBottom);
ctx.stroke();

// シングルスライン
ctx.beginPath();
ctx.moveTo(90,30);
ctx.lineTo(90,490);
ctx.moveTo(270,30);
ctx.lineTo(270,490);
ctx.stroke();


// =====================
// 🔥 打球可能範囲（自動）
// =====================

// 距離によって角度変化
let dist = netY - hitY;

// 最大角度
let baseAngle = 15 + dist * 0.1;

// サイド補正
let sideOffset = (hitX - 180) / 180;
baseAngle += Math.abs(sideOffset) * 10;

let rad = baseAngle * Math.PI / 180;
let length = 500;

let leftX = hitX - Math.tan(rad) * length;
let rightX = hitX + Math.tan(rad) * length;

// 範囲描画
ctx.fillStyle="rgba(255,120,80,0.35)";
ctx.beginPath();
ctx.moveTo(hitX,hitY);
ctx.lineTo(leftX,490);
ctx.lineTo(rightX,490);
ctx.closePath();
ctx.fill();


// =====================
// 前衛（改善）
// =====================

let frontY = netY + (hitY - netY) * 0.3;

// ネット越え防止
if(frontY < netY + 5) frontY = netY + 5;

let frontX = 180 + (hitX - 180) * 0.6;


// =====================
// 後衛
// =====================

let backX = 180 + (hitX - 180) * 0.5;
let backY = 460;


// =====================
// 描画
// =====================

ctx.fillStyle="yellow";
ctx.beginPath();
ctx.arc(frontX,frontY,10,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="cyan";
ctx.beginPath();
ctx.arc(backX,backY,10,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="red";
ctx.beginPath();
ctx.arc(hitX,hitY,12,0,Math.PI*2);
ctx.fill();

}


// =====================
// 打点操作
// =====================

canvas.addEventListener("touchmove",function(e){

let rect=canvas.getBoundingClientRect();

hitX=e.touches[0].clientX-rect.left;
hitY=e.touches[0].clientY-rect.top;

// 横制限
if(hitX<30)hitX=30;
if(hitX>330)hitX=330;

// 縦（相手側＋外OK）
if(hitY<0)hitY=0;
if(hitY>netY-10)hitY=netY-10;

draw();

});

draw();

</script>

</body>
</html>
