<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ソフトテニス戦術AI</title>

<style>
body{
margin:0;
background:#0b1a33;
color:white;
text-align:center;
font-family:sans-serif;
}

canvas{
background:#2e8b57;
border:3px solid white;
touch-action:none;
margin-top:10px;
}
</style>
</head>

<body>

<h2>ソフトテニス戦術AI</h2>
<p>赤点＝相手後衛　黄＝前衛（自動）　青＝後衛</p>

<canvas id="court" width="360" height="520"></canvas>

<script>

const canvas=document.getElementById("court");
const ctx=canvas.getContext("2d");

// 打点（自由移動）
let hitX=180;
let hitY=100;

function draw(){

ctx.clearRect(0,0,360,520);

// --- コート枠 ---
ctx.strokeStyle="white";
ctx.lineWidth=2;
ctx.strokeRect(30,30,300,460);

// センターライン
ctx.beginPath();
ctx.moveTo(180,30);
ctx.lineTo(180,490);
ctx.stroke();

// サービスライン
const serviceY=260;
ctx.beginPath();
ctx.moveTo(30,serviceY);
ctx.lineTo(330,serviceY);
ctx.stroke();

// サービスエンドライン（中央横線）
const midY=160;
ctx.beginPath();
ctx.moveTo(30,midY);
ctx.lineTo(330,midY);
ctx.stroke();

// サービスサイドライン（シングルスライン）
ctx.beginPath();
ctx.moveTo(90,30);
ctx.lineTo(90,490);
ctx.moveTo(270,30);
ctx.lineTo(270,490);
ctx.stroke();


// =====================
// 🔥 前衛ロジック
// =====================

// 縦：打点に応じてサービスライン基準で調整
let frontY = serviceY + (hitY - 100) * 0.6;

// 制限
if(frontY < 120) frontY = 120;
if(frontY > 340) frontY = 340;

// 横：センター基準で寄る
let frontX = 180 + (hitX - 180) * 0.5;


// =====================
// 🔵 後衛ロジック
// =====================

let backX = 180 + (hitX - 180) * 0.7;
let backY = 460;


// =====================
// 描画
// =====================

// 打点範囲（参考）
ctx.fillStyle="rgba(255,150,0,0.25)";
ctx.beginPath();
ctx.arc(hitX,hitY,20,0,Math.PI*2);
ctx.fill();

// 前衛
ctx.fillStyle="yellow";
ctx.beginPath();
ctx.arc(frontX,frontY,10,0,Math.PI*2);
ctx.fill();

// 後衛
ctx.fillStyle="cyan";
ctx.beginPath();
ctx.arc(backX,backY,10,0,Math.PI*2);
ctx.fill();

// 打点
ctx.fillStyle="red";
ctx.beginPath();
ctx.arc(hitX,hitY,12,0,Math.PI*2);
ctx.fill();

}

// 🔴 打点を自由に動かす（縦横対応）
canvas.addEventListener("touchmove",function(e){

let rect=canvas.getBoundingClientRect();

hitX=e.touches[0].clientX-rect.left;
hitY=e.touches[0].clientY-rect.top;

// 範囲制限
if(hitX<30)hitX=30;
if(hitX>330)hitX=330;
if(hitY<30)hitY=30;
if(hitY>490)hitY=490;

draw();

});

draw();

</script>

</body>
</html>
