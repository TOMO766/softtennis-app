<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ソフトテニス戦術AI</title>

<style>
body{
margin:0;
background:#0b1a33;
color:white;
text-align:center;
font-family:sans-serif;
}

canvas{
background:#2e8b57;
border:3px solid white;
touch-action:none;
margin-top:10px;
}

.slider{
width:80%;
}
</style>
</head>

<body>

<h2>ソフトテニス戦術AI</h2>
<p>赤＝相手後衛　黄＝前衛　青＝味方後衛</p>

<canvas id="court" width="360" height="520"></canvas>

<p>打球角度</p>
<input type="range" id="angle" min="10" max="60" value="25" class="slider">
<p id="angleText">25°</p>

<script>

const canvas=document.getElementById("court");
const ctx=canvas.getContext("2d");

let hitX=180;
let hitY=80; // 初期はベースライン付近
let angle=25;

const slider=document.getElementById("angle");

slider.addEventListener("input",function(){
angle=parseInt(this.value);
document.getElementById("angleText").innerText=angle+"°";
draw();
});

function draw(){

ctx.clearRect(0,0,360,520);

// =====================
// コート（実構造）
// =====================

ctx.strokeStyle="white";
ctx.lineWidth=2;

// 外枠（ダブルス）
ctx.strokeRect(30,30,300,460);

// ネット
const netY=260;
ctx.beginPath();
ctx.moveTo(30,netY);
ctx.lineTo(330,netY);
ctx.stroke();

// ベースライン
const topBase=30;
const bottomBase=490;

// サービスライン
const serviceTop=160;
const serviceBottom=360;

// センターライン（サービス内のみ）
ctx.beginPath();
ctx.moveTo(180,serviceTop);
ctx.lineTo(180,serviceBottom);
ctx.stroke();

// サービスライン
ctx.beginPath();
ctx.moveTo(30,serviceTop);
ctx.lineTo(330,serviceTop);
ctx.moveTo(30,serviceBottom);
ctx.lineTo(330,serviceBottom);
ctx.stroke();

// シングルスライン
ctx.beginPath();
ctx.moveTo(90,30);
ctx.lineTo(90,490);
ctx.moveTo(270,30);
ctx.lineTo(270,490);
ctx.stroke();


// =====================
// 打球角度（扇）
// =====================

let rad=angle*Math.PI/180;
let length=420;

let leftX=hitX-Math.tan(rad)*length;
let rightX=hitX+Math.tan(rad)*length;

ctx.fillStyle="rgba(255,150,0,0.3)";
ctx.beginPath();
ctx.moveTo(hitX,hitY);
ctx.lineTo(leftX,490);
ctx.lineTo(rightX,490);
ctx.closePath();
ctx.fill();


// =====================
// 前衛（リアル調整）
// =====================

// ネットとの距離で判断
let distFromNet = hitY - netY;

// 前衛位置（重要ロジック）
let frontY = netY + distFromNet * 0.35;

// 制限
if(frontY < netY - 30) frontY = netY - 30;
if(frontY > 360) frontY = 360;

// 横
let frontX = 180 + (hitX - 180) * 0.6;


// =====================
// 味方後衛
// =====================

let backX = 180 + (hitX - 180) * 0.5;
let backY = 460;


// =====================
// 描画
// =====================

// 前衛
ctx.fillStyle="yellow";
ctx.beginPath();
ctx.arc(frontX,frontY,10,0,Math.PI*2);
ctx.fill();

// 後衛
ctx.fillStyle="cyan";
ctx.beginPath();
ctx.arc(backX,backY,10,0,Math.PI*2);
ctx.fill();

// 打点（相手後衛）
ctx.fillStyle="red";
ctx.beginPath();
ctx.arc(hitX,hitY,12,0,Math.PI*2);
ctx.fill();

}


// =====================
// 打点操作（修正版）
// =====================

canvas.addEventListener("touchmove",function(e){

let rect=canvas.getBoundingClientRect();

hitX=e.touches[0].clientX-rect.left;
hitY=e.touches[0].clientY-rect.top;

// 横制限（コート幅）
if(hitX<30)hitX=30;
if(hitX>330)hitX=330;

// 縦制限（相手側＋ベースライン外OK）
if(hitY < 0) hitY = 0;       // ベースライン外OK
if(hitY > 250) hitY = 250;   // ネットより奥のみ

draw();

});

draw();

</script>

</body>
</html>
